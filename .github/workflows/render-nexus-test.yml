name: render-nexus-test

# Uji 120 frame film NEXUS ZERO Episode 1 "Iteration 214" (Eevee, setting B7
# dengan DEVIASI TERUKUR: samples 6, bukan 8 — sama seperti zombie v2):
#   - S1 hook, plan f0-59      (frame Blender 1-60):     10 job x 6 frame
#   - S7 ECU revelation, plan f1200-1259 (frame Blender 1201-1260): 10 job x 6 frame
#   - 9:16 540x960 lensk 0.62 saja (16:9 menyusul di full run)
#   - actions/cache untuk Blender 4.5.3 (pola zombie-render-farm render-v2-test.yml)
#   - download Blender pakai retry loop
# Dipicu manual dari tab Actions. Repo harus PUBLIK supaya menit gratis.
# Verifikasi setelah selesai: semua 120 frame ada tanpa gap + piksel-diff
# vs render lokal Eevee samples-6 pada frame yang sama (mean abs diff < 1):
#   s1hook/f_0032.png (Blender 33), s1hook/f_0049.png (Blender 50),
#   s7ecu/f_1231.png (Blender 1232).
# Workflow ini TIDAK memicu full run (tugas terpisah setelah tes lolos).
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fmt: "9x16", seg: "s1-01", res_x: 540, res_y: 960, lensk: "0.62", start: 1,    end: 6 }
          - { fmt: "9x16", seg: "s1-02", res_x: 540, res_y: 960, lensk: "0.62", start: 7,    end: 12 }
          - { fmt: "9x16", seg: "s1-03", res_x: 540, res_y: 960, lensk: "0.62", start: 13,   end: 18 }
          - { fmt: "9x16", seg: "s1-04", res_x: 540, res_y: 960, lensk: "0.62", start: 19,   end: 24 }
          - { fmt: "9x16", seg: "s1-05", res_x: 540, res_y: 960, lensk: "0.62", start: 25,   end: 30 }
          - { fmt: "9x16", seg: "s1-06", res_x: 540, res_y: 960, lensk: "0.62", start: 31,   end: 36 }
          - { fmt: "9x16", seg: "s1-07", res_x: 540, res_y: 960, lensk: "0.62", start: 37,   end: 42 }
          - { fmt: "9x16", seg: "s1-08", res_x: 540, res_y: 960, lensk: "0.62", start: 43,   end: 48 }
          - { fmt: "9x16", seg: "s1-09", res_x: 540, res_y: 960, lensk: "0.62", start: 49,   end: 54 }
          - { fmt: "9x16", seg: "s1-10", res_x: 540, res_y: 960, lensk: "0.62", start: 55,   end: 60 }
          - { fmt: "9x16", seg: "s7-01", res_x: 540, res_y: 960, lensk: "0.62", start: 1201, end: 1206 }
          - { fmt: "9x16", seg: "s7-02", res_x: 540, res_y: 960, lensk: "0.62", start: 1207, end: 1212 }
          - { fmt: "9x16", seg: "s7-03", res_x: 540, res_y: 960, lensk: "0.62", start: 1213, end: 1218 }
          - { fmt: "9x16", seg: "s7-04", res_x: 540, res_y: 960, lensk: "0.62", start: 1219, end: 1224 }
          - { fmt: "9x16", seg: "s7-05", res_x: 540, res_y: 960, lensk: "0.62", start: 1225, end: 1230 }
          - { fmt: "9x16", seg: "s7-06", res_x: 540, res_y: 960, lensk: "0.62", start: 1231, end: 1236 }
          - { fmt: "9x16", seg: "s7-07", res_x: 540, res_y: 960, lensk: "0.62", start: 1237, end: 1242 }
          - { fmt: "9x16", seg: "s7-08", res_x: 540, res_y: 960, lensk: "0.62", start: 1243, end: 1248 }
          - { fmt: "9x16", seg: "s7-09", res_x: 540, res_y: 960, lensk: "0.62", start: 1249, end: 1254 }
          - { fmt: "9x16", seg: "s7-10", res_x: 540, res_y: 960, lensk: "0.62", start: 1255, end: 1260 }
    env:
      FS_SAMPLES: "6"
      FS_RAY: "0"
      FS_VOL: "1"
      FS_VOLTILE: "16"
      FS_DOF: "1"
      FS_MB: "1"
      FS_SUB: "1"
      FS_BEVEL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa/EGL + DejaVu font
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 fonts-dejavu-core
          ldconfig -p | grep libEGL

      - name: Restore cached Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-4.5.3-linux-x64
          key: blender-4.5.3-linux-x64

      - name: Download Blender 4.5.3 LTS (cache miss only, with retries)
        # Pelajaran run 44600190210: download.blender.org sempat mengembalikan
        # halaman error 61 KB (bukan tarball ~300 MB) 3x berturut-turut ke job
        # s7-09 — curl tanpa -f menganggapnya sukses, baru tar -tf yang gagal.
        # Fix: curl -f (gagal di HTTP error), cek ukuran >200 MB sebelum tar,
        # dan fallback ke mirror OCF Berkeley kalau primer gagal 3x.
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URLS=(
            "https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz"
            "https://mirrors.ocf.berkeley.edu/blender/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz"
          )
          OK=0
          for URL in "${URLS[@]}"; do
            for i in 1 2 3; do
              echo "Download attempt $i from $URL"
              if curl -fSL --retry 3 --retry-delay 10 --retry-all-errors \
                  -o blender.tar.xz "$URL" \
                  && [ "$(stat -c%s blender.tar.xz)" -gt 200000000 ] \
                  && tar -tf blender.tar.xz >/dev/null; then
                echo "Download OK: $URL attempt $i ($(stat -c%s blender.tar.xz) bytes)"
                OK=1
                break 2
              fi
              echo "Download attempt $i from $URL failed, retrying in 30s..."
              rm -f blender.tar.xz
              sleep 30
            done
          done
          if [ "$OK" != 1 ]; then echo "FAIL: Blender download failed (primer + mirror)"; exit 1; fi
          tar -xf blender.tar.xz
          ./blender-4.5.3-linux-x64/blender --version

      - name: Render 6 frames
        run: |
          START=${{ matrix.start }}
          END=${{ matrix.end }}
          echo "Chunk ${{ matrix.fmt }}-${{ matrix.seg }}: frames $START-$END (cache-hit=${{ steps.cache-blender.outputs.cache-hit }})"
          mkdir -p "$GITHUB_WORKSPACE/out"
          S=$(date +%s)
          # NOTE: keberhasilan dinilai dari FILE FRAME, bukan exit code Blender —
          # Mesa bisa segfault saat teardown SETELAH semua frame tersimpan.
          ./blender-4.5.3-linux-x64/blender -b --factory-startup \
            -P pipeline-nexus/animate_nexus.py -- "$GITHUB_WORKSPACE/out" \
            --start $START --end $END --plan pipeline-nexus/plan.json \
            --res ${{ matrix.res_x }} ${{ matrix.res_y }} --lensk ${{ matrix.lensk }} || echo "blender exited rc=$?"
          E=$(date +%s)
          N=$(ls "$GITHUB_WORKSPACE/out"/f_*.png 2>/dev/null | wc -l)
          echo "CHUNK=${{ matrix.fmt }}-${{ matrix.seg }} CACHE_HIT=${{ steps.cache-blender.outputs.cache-hit }} FRAMES=$N/6 SECS=$((E-S))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$N" -lt 6 ]; then echo "FAIL: only $N/6 frames rendered"; exit 1; fi

      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: nexus-frames-${{ matrix.fmt }}-${{ matrix.seg }}
          path: out/f_*.png
          if-no-files-found: error
