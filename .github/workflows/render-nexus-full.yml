name: render-nexus-full

# Full run film NEXUS ZERO Episode 1 "Iteration 214" (Eevee, setting B7
# dengan DEVIASI TERUKUR: samples 6, bukan 8 — sama seperti zombie v2):
#   9:16  540x960 lensk 0.62: frame Blender 1-1440 (20 job x 72 frame)
#   16:9  960x540 lensk 1.00: frame Blender 1-1440 (20 job x 72 frame)
#   (Frame Blender = plan f + 1; plan f 0-1439.)
#   40 job paralel x 72 frame = 2880 frame total.
# Pipeline nexus di pipeline-nexus/ (md5 identik dengan shorts/nexus-zero/pipeline/).
# Tiap job zip frame-nya lalu upload sebagai release asset ke release yang
# namanya diisi di input `release_tag` pakai `gh release upload`.
# Release nexus-full-run-20261120 DIBUAT DULU dari luar (sebelum trigger).
# JANGAN sentuh workflow/Release tes (render-nexus-test.yml, run 44601325584).
# Download Blender: curl -fSL + cek ukuran >200 MB + fallback mirror OCF
# Berkeley (pelajaran tes run 44600190210 — halaman error 61 KB 3x).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nama release GitHub yang SUDAH dibuat dulu dari luar (40 job upload zip chunk ke sini)"
        required: true
        type: string

