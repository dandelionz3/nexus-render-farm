    env:
      FS_SAMPLES: "6"
      FS_RAY: "0"
      FS_VOL: "1"
      FS_VOLTILE: "16"
      FS_DOF: "1"
      FS_MB: "1"
      FS_SUB: "1"
      FS_BEVEL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa/EGL + DejaVu font + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 fonts-dejavu-core zip
          ldconfig -p | grep libEGL
          zip -v | head -2

      - name: Restore cached Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-4.5.3-linux-x64
          key: blender-4.5.3-linux-x64

      - name: Download Blender 4.5.3 LTS (cache miss only, with retries)
        # WAJIB (pelajaran tes run 44600190210): download.blender.org sempat
        # mengembalikan halaman error 61 KB (bukan tarball ~300 MB) 3x
        # berturut-turut — curl tanpa -f menganggapnya sukses, baru tar -tf
        # yang gagal. Fix: curl -f (gagal di HTTP error), cek ukuran >200 MB
        # sebelum tar, dan fallback ke mirror OCF Berkeley kalau primer gagal 3x.
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URLS=(
            "https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz"
            "https://mirrors.ocf.berkeley.edu/blender/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz"
          )
          OK=0
          for URL in "${URLS[@]}"; do
            for i in 1 2 3; do
              echo "Download attempt $i from $URL"
              if curl -fSL --retry 3 --retry-delay 10 --retry-all-errors \
                  -o blender.tar.xz "$URL" \
                  && [ "$(stat -c%s blender.tar.xz)" -gt 200000000 ] \
                  && tar -tf blender.tar.xz >/dev/null; then
                echo "Download OK: $URL attempt $i ($(stat -c%s blender.tar.xz) bytes)"
                OK=1
                break 2
              fi
              echo "Download attempt $i from $URL failed, retrying in 30s..."
              rm -f blender.tar.xz
              sleep 30
            done
          done
          if [ "$OK" != 1 ]; then echo "FAIL: Blender download failed (primer + mirror)"; exit 1; fi
          tar -xf blender.tar.xz
          ./blender-4.5.3-linux-x64/blender --version

      - name: Render frames
        run: |
          START=${{ matrix.start }}
          END=${{ matrix.end }}
          EXPECTED=$((END - START + 1))
          echo "Chunk ${{ matrix.name }}: frames $START-$END ($EXPECTED frames)"
          mkdir -p "$GITHUB_WORKSPACE/out"
          S=$(date +%s)
          # NOTE: keberhasilan dinilai dari FILE FRAME, bukan exit code Blender —
          # Mesa bisa segfault saat teardown SETELAH semua frame tersimpan.
          ./blender-4.5.3-linux-x64/blender -b --factory-startup \
            -P pipeline-nexus/animate_nexus.py -- "$GITHUB_WORKSPACE/out" \
            --start $START --end $END --plan pipeline-nexus/plan.json \
            --res ${{ matrix.res_x }} ${{ matrix.res_y }} --lensk ${{ matrix.lensk }} || echo "blender exited rc=$?"
          E=$(date +%s)
          N=$(ls "$GITHUB_WORKSPACE/out"/f_*.png 2>/dev/null | wc -l)
          echo "CHUNK=${{ matrix.name }} FRAMES=$N/$EXPECTED SECS=$((E-S))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$N" -lt "$EXPECTED" ]; then echo "FAIL: only $N/$EXPECTED frames rendered"; exit 1; fi

      - name: Zip + upload chunk to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHUNK: ${{ matrix.name }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set -euo pipefail
          EXPECTED=$((END - START + 1))
          cd "$GITHUB_WORKSPACE/out"
          zip -q "../${CHUNK}.zip" f_*.png
          cd "$GITHUB_WORKSPACE"
          ZIPSIZE=$(stat -c%s "${CHUNK}.zip")
          ZIPSIZE_MB=$((ZIPSIZE / 1024 / 1024))
          INZIP=$(unzip -l "${CHUNK}.zip" | grep -c 'f_[0-9]*\.png')
          echo "CHUNK=$CHUNK ZIP=${ZIPSIZE_MB}MB FILES_IN_ZIP=$INZIP/$EXPECTED" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ZIPSIZE" -ge 2147483648 ]; then echo "FAIL: zip >= 2 GB ($ZIPSIZE bytes)"; exit 1; fi
          if [ "$INZIP" -lt "$EXPECTED" ]; then echo "FAIL: zip holds $INZIP, expected $EXPECTED"; exit 1; fi
          # Release (input release_tag) dibuat dulu dari luar sebelum trigger,
          # jadi 40 job paralel tinggal upload (clobber = timpa kalau re-run).
          gh release upload "${{ inputs.release_tag }}" "${CHUNK}.zip" --clobber
          gh release view "${{ inputs.release_tag }}" --json assets \
            --jq ".assets[] | select(.name == \"${CHUNK}.zip\") | .name + \" \" + (.size|tostring)"
